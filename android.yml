name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # §16 rule (onNotificationPosted stays fast) is partly enforced here:
      # detekt's complexity thresholds catch an entry point that's grown
      # beyond a single delegating call.
      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

  unit-test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Heaviest coverage target per ARCHITECTURE.md §8: the redaction
      # pass (§8 of agents.md), content-hash logic, entity mappers.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: android/**/build/reports/tests/

  instrumented-test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Room DAOs and WorkManager worker behavior — needs an emulator,
      # so this is the slower/more expensive job of the three.
      - name: Room / WorkManager instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest
