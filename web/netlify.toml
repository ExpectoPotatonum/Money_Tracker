[build]
  command = "npm run build"
  publish = "dist"

# Static SPA: fall back to index.html for unknown paths (hash routing and any
# future OAuth callback). Single user behind Supabase Auth (agents.md §12).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# PWA update hygiene: the service worker and its Workbox chunks must never be
# cached by Netlify's CDN — a stale cached sw.js would pin the old app forever
# and defeat registerType:autoUpdate. The manifest is tiny and per-build, so
# no-cache it too.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
