name: Supabase CI

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'

jobs:
  lint-test-and-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      # parser.ts and merchantResolver.ts are pure functions by design
      # (ARCHITECTURE.md §4) — no DB/network mocking needed here.
      - name: Unit tests
        run: deno test --allow-read functions/ tests/

      # Required check for any PR touching parser_templates or parser.ts.
      # Replays every stored sample_input against its body_pattern so a
      # "fixed HLB, broke TnG" regression fails in CI, not in prod.
      # See agents.md §9/§15 and ARCHITECTURE.md §4.
      - name: Parser template regression harness
        run: deno run --allow-read --allow-env scripts/replay-templates.ts

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4

      # Bare Postgres has no Supabase auth schema. Apply the CI-only stubs
      # first so auth.users FKs and auth.uid() resolve during migration.
      - name: Bootstrap auth schema stubs
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/_bootstrap_auth.sql

      - name: Apply every migration, in order, to a fresh Postgres
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls migrations/*.sql | sort); do
            echo "Applying $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      # ARCHITECTURE.md §6 — both immutability triggers must raise on the
      # mutation they exist to block, not silently succeed. Also smoke-tests
      # that the legitimate parse-status update path is still allowed.
      - name: Verify immutability triggers reject mutation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/verify_immutability_triggers.sql
