name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check (Prettier, ARCHITECTURE.md §7)
        run: npm run format:check

      # Placeholder values: the bundle only needs a well-formed URL/key to
      # construct the Supabase client (RLS and the real project URL protect
      # data). The e2e suite mocks the REST layer, and auth.spec asserts the
      # gate that renders when there is no session — nothing here hits a live
      # project. Deploy config (netlify.toml) supplies real values via Netlify
      # env vars when that becomes relevant.
      - name: Build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
        run: npm run build

      # Deliberately light per ARCHITECTURE.md §8 — a handful of
      # critical paths only, not broad coverage of a thin read layer
      # whose correctness is already guaranteed upstream by RLS.
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/

  # Deploy is handled by Netlify's own GitHub integration on merge to
  # main — no deploy step needed here (ARCHITECTURE.md §9).
